<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Techsol Soluções em Tecnologia | Engenharia Aplicada do Ecossistema Quartzgroup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Techsol Soluções em Tecnologia – unidade de engenharia aplicada e inovação do Ecossistema Quartzgroup. Projetos em energia renovável, construções inteligentes, TIC, infraestrutura digital crítica (incluindo apoio a data centers) e tecnologias de impacto ambiental." />

  <style>
    :root {
      --bg-body: #020617;
      --bg-surface: #0b1220;
      --bg-soft: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-strong: #0ea5e9;
      --text-main: #e5e7eb;
      --text-soft: #9ca3af;
      --text-mute: #6b7280;
      --border-soft: rgba(148, 163, 184, 0.3);
      --card-border: rgba(148, 163, 184, 0.4);
      --shadow-soft: 0 24px 60px rgba(15, 23, 42, 0.8);
      --radius-lg: 18px;
      --radius-pill: 999px;
      --nav-height: 72px;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--nav-height);
    }

    body {
      font-family: var(--font-sans);
      background: radial-gradient(circle at top, #020617 0, #020617 40%, #000 100%);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    .page-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    /* NAVBAR */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(18px);
      background: linear-gradient(
        to bottom,
        rgba(15, 23, 42, 0.96),
        rgba(15, 23, 42, 0.9),
        transparent
      );
      border-bottom: 1px solid rgba(51, 65, 85, 0.7);
    }

    .nav-bar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: radial-gradient(circle at 30% 20%, #38bdf8, transparent 55%),
        radial-gradient(circle at 70% 80%, #22c55e, transparent 60%),
        radial-gradient(circle at 120% -20%, #facc15, transparent 55%);
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9),
        0 10px 30px rgba(15, 23, 42, 0.85);
    }

    .brand-text h1 {
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .brand-text span {
      display: block;
      font-size: 0.72rem;
      color: var(--text-soft);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.9rem;
    }

    .nav-links a {
      position: relative;
      color: var(--text-soft);
      padding: 6px 0;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.18s ease-out;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #020617;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(34, 197, 94, 0.35);
      border: 1px solid rgba(15, 23, 42, 0.6);
    }

    .nav-cta span {
      font-size: 0.9rem;
    }

    /* HERO */

    .hero {
      padding-top: 42px;
      padding-bottom: 40px;
    }

    .hero-inner {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.2fr);
      gap: 32px;
      align-items: center;
    }

    .kicker {
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .hero h2 {
      font-size: clamp(2.2rem, 4vw, 2.8rem);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero-gradient {
      background: radial-gradient(circle at 0 0, #38bdf8 0, transparent 50%),
        radial-gradient(circle at 100% 120%, #22c55e 0, transparent 60%);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: var(--text-soft);
      max-width: 520px;
      margin-bottom: 18px;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.8);
      color: var(--text-soft);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-primary,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 9px 18px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out,
        background 0.12s ease-out, border-color 0.12s ease-out,
        color 0.12s ease-out;
    }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #020617;
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 24px 55px rgba(56, 189, 248, 0.45);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(148, 163, 184, 0.55);
      color: var(--text-main);
    }

    .btn-ghost:hover {
      background: rgba(15, 23, 42, 1);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .hero-footnote {
      font-size: 0.78rem;
      color: var(--text-mute);
    }

    .hero-diagram {
      background: radial-gradient(circle at 10% 0, rgba(56, 189, 248, 0.35), transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(34, 197, 94, 0.35), transparent 58%);
      border-radius: 26px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      box-shadow: var(--shadow-soft);
      padding: 18px 18px 16px;
    }

    .diagram-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .diagram-title {
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #e5e7eb;
    }

    .diagram-tag {
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.5);
      color: var(--text-soft);
    }

    .diagram-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .diagram-card {
      border-radius: 14px;
      padding: 10px 11px;
      background: rgba(2, 6, 23, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.5);
      font-size: 0.8rem;
    }

    .diagram-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin-bottom: 2px;
    }

    .diagram-main {
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 2px;
    }
